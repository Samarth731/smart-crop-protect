[project]
name = "scp-ml"
version = "1.0.0"
description = "Smart Crop Protect: data pipelines, model training, evaluation and ONNX export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5,<1.7",
  "skl2onnx>=1.17",
  "onnx>=1.16,<1.18",
  "onnxruntime>=1.18",
  "requests>=2.32",
  "matplotlib>=3.9",
  "pyarrow>=16",
  "protobuf>=4.25,<6",
  "joblib>=1.4",
]

[project.optional-dependencies]
vision = ["torch>=2.4", "torchvision>=0.19", "pillow>=10", "onnxscript>=0.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scp_ml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
